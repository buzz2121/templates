kind = "web"
previewPath = "/"
title = "NOX VOYAGES"
version = "1.0.0"
id = "artifacts/nox-voyages"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23022

[services.development]
run = "pnpm --filter @workspace/nox-voyages run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nox-voyages", "run", "build" ]
publicDir = "artifacts/nox-voyages/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23022"
BASE_PATH = "/"
